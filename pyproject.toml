[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "notesvault"
version = "0.1.0"
description = "A PyEdifice desktop app for iCloud Notes backups with local Git history"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyicloud==2.7.0",
  "keyring>=25.7,<26",
  "platformdirs>=4.4,<5",
  "python-dotenv>=1.2,<2",
  "filelock>=3.20,<4",
  "pyedifice==5.0.1",
  "pyside6-essentials>=6.8,<7",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "build>=1.3", "hatchling>=1.27"]
exe = ["pyinstaller>=6.16,<7"]

[project.scripts]
notesvault = "notesvault.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/notesvault"]
